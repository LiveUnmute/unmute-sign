<title>Unmute — sign-language communication for hospitals</title>

<meta name="theme-color" content="#E3E1DC">

<!-- ── Live engine ──────────────────────────────────────────────────────
     Uncomment and fill in to switch the app from the scripted demo to real
     sign recognition. Use a **PUBLIC** key from client.sign-speak.com —
     a private key here is a key anyone can spend. See INTEGRATION.md.

     <meta name="signspeak-key" content="PUB-xxxxxxxx">
     <meta name="signspeak-model" content="SLR.2.sm">

     Leave both commented out and the app runs the scripted demo, labelled
     "Demo" in the corner. That is the safe default for a public deployment.
     ─────────────────────────────────────────────────────────────────── -->
